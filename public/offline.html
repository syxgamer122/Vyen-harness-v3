<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Không có kết nối — Vyen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /*
     * Trang này đứng NGOÀI bundle React nên không đọc được token trong
     * `globals.css` — mọi giá trị dưới đây là bản chép của token §2 và phải
     * được giữ khớp: nền `bg-sunken` (#f7f7f7, cùng `theme_color` trong
     * `app/layout.tsx` và `APP_BACKGROUND` trong `app/manifest.ts`), chữ
     * `text-primary`, màu nhấn `accent` (#0B7A53).
     *
     * Dấu hiệu lấy từ `public/icons/icon-192.png` — cùng asset mà PWA dùng —
     * thay vì vẽ lại: logo vẽ tay ở đây đã lệch màu với logo trong app, và
     * đó chính là lý do file này bị gỡ khỏi nguồn sự thật chung.
     */
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      color: #18181b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .bubble {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #ffffff;
      border: 1px solid rgba(24, 24, 27, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .bubble img { display: block; width: 40px; height: 40px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #18181b; }
    p { font-size: 14px; color: #575757; line-height: 1.6; }
    button {
      margin-top: 24px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #0B7A53;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #096246; }
  </style>
</head>
<body>
  <main>
    <div class="bubble">
      <img src="/icons/icon-192.png" width="40" height="40" alt="Vyen" />
    </div>
    <h1>Không có kết nối mạng</h1>
    <p>Lịch sử chat của bạn vẫn an toàn trên thiết bị.<br />Kết nối lại mạng rồi thử nhé.</p>
    <button onclick="location.reload()">Thử lại</button>
  </main>
</body>
</html>
